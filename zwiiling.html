<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a84ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="二维码记录">
  <title>二维码记录</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root { color-scheme: light; --blue:#0a84ff; --red:#ff3b30; --line:#d9dee7; --bg:#f5f7fb; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:#172033; }
    main { max-width:780px; margin:auto; padding:18px 14px 40px; }
    h1 { margin:4px 0 14px; font-size:26px; }
    .card { background:#fff; border-radius:16px; padding:14px; margin-bottom:14px; box-shadow:0 2px 12px rgba(20,35,70,.08); }
    #reader { width:100%; overflow:hidden; border-radius:12px; }
    .buttons { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px; }
    button, input { font:inherit; }
    button { border:0; border-radius:11px; padding:12px; font-weight:650; cursor:pointer; }
    .primary { background:var(--blue); color:white; }
    .secondary { background:#e8eef7; color:#17304d; }
    .danger { background:#fff0ef; color:#b42318; }
    label { display:block; font-size:13px; color:#586174; margin:10px 0 5px; }
    input[type="text"] { width:100%; border:1px solid var(--line); border-radius:10px; padding:12px; background:#fff; }
    #status { min-height:24px; margin:10px 2px 0; font-weight:650; color:#176b38; }
    #status.warn { color:#b54708; }
    .table-wrap { overflow-x:auto; scroll-behavior:smooth; border:1px solid var(--line); border-radius:12px; }
    table { width:100%; border-collapse:collapse; min-width:570px; background:#fff; }
    th, td { border-bottom:1px solid var(--line); padding:10px; text-align:left; vertical-align:middle; }
    th { position:sticky; top:0; background:#eef4fb; font-size:13px; }
    tr:last-child td { border-bottom:0; }
    td.code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; word-break:break-all; }
    td.note input { min-width:145px; padding:9px; }
    .delete { padding:8px 10px; background:#fff0ef; color:#b42318; }
    .highlight { animation:flash 2.4s ease; }
    @keyframes flash { 0%,45% { background:#fff0b8; } 100% { background:#fff; } }
    .empty { text-align:center; color:#7a8394; padding:24px; }
    .small { color:#697386; font-size:12px; line-height:1.5; }
    .toolbar { display:flex; gap:8px; justify-content:space-between; align-items:center; margin-bottom:9px; }
    .toolbar h2 { margin:0; font-size:19px; }
    .toolbar button { padding:8px 10px; }
    .search-row { display:grid; grid-template-columns:1fr auto; gap:8px; margin-bottom:10px; }
    .search-row input { margin:0; }
    .count { color:#697386; font-size:12px; margin:0 0 8px; }
  </style>
</head>
<body>
<main>
  <h1>📷 二维码记录</h1>

  <section class="card">
    <div id="reader"></div>
    <div class="buttons">
      <button id="startBtn" class="primary">打开摄像头</button>
      <button id="stopBtn" class="secondary" disabled>关闭摄像头</button>
    </div>
    <p class="small">首次使用请选择“允许”摄像头。扫描成功后会自动关闭摄像头，并把内容放入下方输入框。</p>
  </section>

  <section class="card">
    <label for="codeInput">第一列：二维码（也可以手动输入）</label>
    <input id="codeInput" type="text" autocomplete="off" autocapitalize="characters" placeholder="扫描或输入字母、数字">

    <label for="dateInput">第二列：日期（月/日）</label>
    <input id="dateInput" type="text" inputmode="numeric" maxlength="5" placeholder="MM/DD">

    <label for="noteInput">第三列：备注（可留空）</label>
    <input id="noteInput" type="text" autocomplete="off" placeholder="自己输入">

    <button id="saveBtn" class="primary" style="width:100%;margin-top:12px;">更新（保存一次）</button>
    <div id="status" role="status" aria-live="polite"></div>
  </section>

  <section class="card">
    <div class="toolbar">
      <h2>保存表格</h2>
      <button id="exportBtn" class="secondary">导出 CSV</button>
    </div>
    <div class="search-row">
      <input id="searchInput" type="text" autocomplete="off" placeholder="搜索二维码、日期或备注">
      <button id="clearSearchBtn" class="secondary">清除</button>
    </div>
    <p id="resultCount" class="count"></p>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>二维码</th><th>日期</th><th>备注</th><th>操作</th></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </section>
</main>

<script>
(() => {
  const KEY = 'qr_records_v1';
  const codeInput = document.getElementById('codeInput');
  const dateInput = document.getElementById('dateInput');
  const noteInput = document.getElementById('noteInput');
  const status = document.getElementById('status');
  const tbody = document.getElementById('tbody');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const searchInput = document.getElementById('searchInput');
  const resultCount = document.getElementById('resultCount');
  let scanner = null;
  let scanning = false;
  let scanLocked = false;

  function todayMMDD() {
    const d = new Date();
    return String(d.getMonth()+1).padStart(2,'0') + '/' + String(d.getDate()).padStart(2,'0');
  }

  function loadRecords() {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; }
    catch { return []; }
  }

  function storeRecords(rows) {
    localStorage.setItem(KEY, JSON.stringify(rows));
  }

  function normalizeCode(value) {
    return value.trim();
  }

  function setStatus(message, warn=false) {
    status.textContent = message;
    status.className = warn ? 'warn' : '';
  }

  function findDuplicate(code) {
    return loadRecords().findIndex(r => r.code.toUpperCase() === code.toUpperCase());
  }

  function jumpToRow(index) {
    searchInput.value = '';
    render();
    requestAnimationFrame(() => {
      const row = document.querySelector(`[data-index="${index}"]`);
      if (!row) return;
      row.scrollIntoView({behavior:'smooth', block:'center'});
      row.classList.remove('highlight');
      void row.offsetWidth;
      row.classList.add('highlight');
    });
  }

  function handleIncomingCode(raw) {
    const code = normalizeCode(raw);
    if (!code) return;
    codeInput.value = code;
    dateInput.value = todayMMDD();
    const duplicateIndex = findDuplicate(code);
    if (duplicateIndex >= 0) {
      setStatus('请更新：这个二维码已经存在，已跳到旧记录。', true);
      jumpToRow(duplicateIndex);
    } else {
      setStatus('读取成功。确认内容后，按“更新（保存一次）”。');
      codeInput.scrollIntoView({behavior:'smooth', block:'center'});
    }
  }

  async function startScanner() {
    if (scanning) return;
    if (typeof Html5Qrcode === 'undefined') {
      setStatus('扫描组件没有加载成功，请确认网络连接后刷新页面。', true);
      return;
    }
    scanner = scanner || new Html5Qrcode('reader');
    scanLocked = false;
    try {
      await scanner.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: (w,h) => ({width: Math.min(260,w-30), height: Math.min(260,h-30)}) },
        async decodedText => {
          if (scanLocked) return;
          scanLocked = true;
          handleIncomingCode(decodedText);
          if (navigator.vibrate) navigator.vibrate(120);
          await stopScanner();
        },
        () => {}
      );
      scanning = true;
      startBtn.disabled = true;
      stopBtn.disabled = false;
      setStatus('摄像头已打开，请对准二维码。');
    } catch (err) {
      setStatus('无法打开摄像头。请在 Safari 网站设置中允许摄像头，然后重试。', true);
    }
  }

  async function stopScanner() {
    if (!scanner || !scanning) return;
    try { await scanner.stop(); }
    catch {}
    scanning = false;
    startBtn.disabled = false;
    stopBtn.disabled = true;
  }

  function render() {
    const rows = loadRecords();
    const query = searchInput.value.trim().toUpperCase();
    const visibleRows = rows
      .map((row, originalIndex) => ({row, originalIndex}))
      .filter(({row}) => !query || [row.code, row.date, row.note || '']
        .some(value => String(value).toUpperCase().includes(query)));

    tbody.innerHTML = '';
    resultCount.textContent = query
      ? `找到 ${visibleRows.length} 条，共 ${rows.length} 条记录`
      : `共 ${rows.length} 条记录`;

    if (!visibleRows.length) {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td colspan="4" class="empty">${rows.length ? '没有符合条件的记录' : '还没有记录'}</td>`;
      tbody.appendChild(tr);
      return;
    }

    visibleRows.forEach(({row: r, originalIndex}) => {
      const tr = document.createElement('tr');
      tr.dataset.index = originalIndex;

      const codeTd = document.createElement('td');
      codeTd.className = 'code';
      codeTd.textContent = r.code;

      const dateTd = document.createElement('td');
      dateTd.textContent = r.date;

      const noteTd = document.createElement('td');
      noteTd.className = 'note';
      const note = document.createElement('input');
      note.type = 'text';
      note.value = r.note || '';
      note.placeholder = '输入备注';
      note.addEventListener('change', () => {
        const current = loadRecords();
        if (!current[originalIndex]) return;
        current[originalIndex].note = note.value;
        storeRecords(current);
        setStatus('备注已保存。');
        render();
      });
      noteTd.appendChild(note);

      const actionTd = document.createElement('td');
      const del = document.createElement('button');
      del.className = 'delete';
      del.textContent = '删除';
      del.addEventListener('click', () => {
        if (!confirm(`确定删除 ${r.code} 吗？`)) return;
        const current = loadRecords();
        current.splice(originalIndex, 1);
        storeRecords(current);
        render();
        setStatus('记录已删除。');
      });
      actionTd.appendChild(del);

      tr.append(codeTd, dateTd, noteTd, actionTd);
      tbody.appendChild(tr);
    });
  }

  function saveNew() {
    const code = normalizeCode(codeInput.value);
    const date = dateInput.value.trim() || todayMMDD();
    const note = noteInput.value.trim();
    if (!code) {
      setStatus('请先扫描或手动输入二维码。', true);
      codeInput.focus();
      return;
    }
    const duplicateIndex = findDuplicate(code);
    if (duplicateIndex >= 0) {
      setStatus('请更新：这个二维码已经存在，已跳到旧记录。', true);
      jumpToRow(duplicateIndex);
      return;
    }
    const rows = loadRecords();
    rows.unshift({code, date, note});
    storeRecords(rows);
    render();
    codeInput.value = '';
    dateInput.value = todayMMDD();
    noteInput.value = '';
    setStatus('已保存。新记录已放在最上面。');
    window.scrollTo({top: document.body.scrollHeight, behavior:'smooth'});
  }



  function exportCsv() {
    const rows = loadRecords();
    const esc = value => '"' + String(value ?? '').replaceAll('"', '""') + '"';
    const csv = '\uFEFF' + [['二维码', '日期', '备注'], ...rows.map(r => [r.code, r.date, r.note])]
      .map(row => row.map(esc).join(',')).join('\r\n');
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `二维码记录_${new Date().toISOString().slice(0,10)}.csv`;
    link.click();
    setTimeout(() => URL.revokeObjectURL(link.href), 1000);
    setStatus('CSV 已导出。');
  }

  startBtn.addEventListener('click', startScanner);
  stopBtn.addEventListener('click', stopScanner);
  document.getElementById('saveBtn').addEventListener('click', saveNew);
  document.getElementById('exportBtn').addEventListener('click', exportCsv);
  searchInput.addEventListener('input', render);
  document.getElementById('clearSearchBtn').addEventListener('click', () => {
    searchInput.value = '';
    render();
    searchInput.focus();
  });
  dateInput.value = todayMMDD();
  render();
})();
</script>
</body>
</html>
